services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: pabetoop-club:local
    ports:
      - "${APP_PORT:-8090}:8090"
    env_file:
      - path: .env
        required: false
    environment:
      APP_ENV: ${APP_ENV:-development}
      STUB: ${STUB:-1}
    volumes:
      - pb_data:/app/pb_data
    init: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8090/_healthz"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  pb_data:
    name: pabetoop_club_pb_data
