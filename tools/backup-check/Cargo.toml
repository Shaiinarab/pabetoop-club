[package]
name = "backup-check"
version = "0.1.0"
edition = "2021"
description = "Offline integrity checker for PocketBase backup archives"
license = "MIT"
publish = false

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
zip = { version = "0.6", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "=3.10.1"
